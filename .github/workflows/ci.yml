name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck extension
        run: npm run typecheck:extension

      - name: Test
        run: npm test

      - name: Build server
        run: npm run build

      - name: Build extension
        run: npm run build:extension

      - name: Package extension
        run: npm run package:extension

      - name: Smoke DRC over stdio and WebSocket (simulated editor)
        run: npm run test:smoke:drc

      - name: Build docs
        run: npm run docs:build
