name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR title prefix
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/bump-version.mjs --check-pr-title "$PR_TITLE" --base-ref "$BASE_REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck extension
        run: npm run typecheck:extension

      - name: Test
        run: npm test

      - name: Build server
        run: npm run build

      - name: Build extension
        run: npm run build:extension

      - name: Package extension
        run: npm run package:extension

      - name: Package MCPB bundle
        run: npm run package:mcpb

      - name: Smoke DRC over stdio and WebSocket
        run: npm run test:smoke:drc

      - name: Build docs
        run: npm run docs:build
