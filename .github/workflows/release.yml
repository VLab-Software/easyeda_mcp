name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          EXPECTED_TAG="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match package.json version '$EXPECTED_TAG'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm run typecheck:extension
          npm test
          npm run docs:build

      - name: Package server, extension, and MCPB bundle
        run: npm run setup:local

      - name: Smoke DRC over stdio and WebSocket
        run: npm run test:smoke:drc

      - name: Generate checksums
        run: |
          cd build/dist
          sha256sum *.eext *.mcpb > SHA256SUMS.txt

      - name: Write release notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('extension/extension.json', 'utf8'));
          fs.writeFileSync('RELEASE_NOTES.md', [
            'EasyEDA Pro MCP release.',
            '',
            '### Quick Install (All AI Clients)',
            '',
            '```bash',
            'npx -y @vlabsoft/easyeda-pro-mcp setup',
            '```',
            '',
            '### Release Assets',
            '',
            `- \`${manifest.name}_v${manifest.version}.eext\`: versioned EasyEDA Pro extension package`,
            '- `easyeda_mcp_bridge.eext`: stable filename for the EasyEDA Pro extension package',
            `- \`easyeda-pro-mcp_v${pkg.version}.mcpb\`: versioned 1-click MCPB bundle`,
            '- `easyeda-pro-mcp.mcpb`: stable filename for the 1-click MCPB bundle',
            '- `SHA256SUMS.txt`: SHA-256 checksums for all release assets',
            '',
            'See the [Quick Start](https://vlabsoft.org/easyeda_mcp/quick-start) and [AI Client Setup](https://vlabsoft.org/easyeda_mcp/ai-client-setup) guides for full instructions.',
            ''
          ].join('\n'));
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/dist/*.eext \
            build/dist/*.mcpb \
            build/dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

  publish-registries:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies and build packages
        run: |
          npm ci
          npm run setup:local

      - name: Publish to npm
        id: npm_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm publish --provenance --access public; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::warning::npm publish skipped: configure NPM_TOKEN secret or npm OIDC Trusted Publishing for ${PKG_NAME}."
              echo "published=false" >> "$GITHUB_OUTPUT"
            else
              exit 1
            fi
          fi

      - name: Publish to Official MCP Registry
        if: steps.npm_publish.outputs.published == 'true'
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
